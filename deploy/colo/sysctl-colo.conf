# Host-level tuning for a colocated low-latency node. Copy to
# /etc/sysctl.d/99-llm-firewall-colo.conf and apply with `sysctl --system`,
# or inject via cloud-init at VM first boot.
#
# This is conservative, well-established low-latency tuning, not exotic; still
# validate against the real NIC driver and kernel version before production use.

# --- determinism over throughput -------------------------------------------------
# Automatic NUMA page migration fights pinned placement; disable once the
# application's cores/memory are deliberately pinned to one NUMA node.
kernel.numa_balancing = 0

# Swapping a pinned, latency-sensitive process is exactly the kind of multi-ms
# stall this whole deployment exists to avoid.
vm.swappiness = 0

# --- networking ---------------------------------------------------------------
# Busy-poll sockets instead of waiting for an interrupt: trades CPU for latency
# on the node-to-node hop. 50 (microseconds) is a starting point, not a
# measured optimum -- ADAPT after profiling the real NIC.
net.core.busy_poll = 50
net.core.busy_read = 50

# Headroom for bursts without dropping packets under load (e.g. a burst of
# escalations to System 2, or market-data bursts on an adjacent interface).
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432

# Present on most current kernels as a compatibility knob; its effect on
# modern TCP stacks is minor compared to busy_poll/TCP_NODELAY, which is why
# Nagling is disabled at the socket level instead (httpx/mitmproxy do this
# implicitly via HTTP keep-alive with small requests). Harmless to set either way.
net.ipv4.tcp_low_latency = 1

# --- huge pages -----------------------------------------------------------------
# Transparent huge pages: "madvise" lets the ONNX Runtime / torch processes opt
# in explicitly without unpredictable background compaction stalling other
# processes on the same pinned cores.
# (Set via /sys/kernel/mm/transparent_hugepage/enabled in tune-host.sh --
# there is no sysctl for this on most distributions.)
