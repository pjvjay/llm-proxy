events {
    worker_connections 1024;
}

http {
    # Log format that captures the full URI for auditability
    log_format proxy_log '$remote_addr [$time_local] "$request" '
                         '$status $body_bytes_sent $request_time '
                         '"$http_user_agent" fw_action=$upstream_http_x_llm_firewall_action '
                         'owasp=$upstream_http_x_llm_firewall_owasp';

    access_log /var/log/nginx/access.log proxy_log;
    error_log  /var/log/nginx/error.log warn;

    upstream firewall {
        server ${FIREWALL_UPSTREAM};     # substituted by entrypoint.sh (default mitmproxy:8080)
        keepalive 32;                    # reuse connections to mitmproxy instead of one per request
    }

    server {
        listen 443 ssl;
        server_name nginx localhost;

        # ── TLS configuration ───────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Above the firewall's MAX_REQUEST_BYTES (4 MB default), so oversized
        # requests get the firewall's OWASP LLM10-tagged answer, not a bare 413.
        client_max_body_size 16m;

        # The firewall's internal endpoints (health, metrics, OWASP summary)
        # are for the internal network / Prometheus only.
        location /firewall/ {
            return 404;
        }

        # ── Proxy to mitmproxy ──────────────────────────────────────────────
        location / {
            proxy_pass         http://firewall;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";

            # Rewrite Host to api.openai.com so mitmproxy (in reverse mode)
            # knows which upstream to forward the request to.
            proxy_set_header   Host              api.openai.com;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Preserve all original client headers (Authorization, Content-Type, …)
            proxy_pass_request_headers on;

            # Generous timeouts: upstream generation (and System-2 judging) can be slow
            proxy_connect_timeout 10s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;

            # Server-sent events (stream: true): never buffer or cache
            proxy_buffering off;
            proxy_cache     off;
        }
    }
}
